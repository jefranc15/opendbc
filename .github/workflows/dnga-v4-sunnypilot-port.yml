name: Apply DNGA V4.0 Sunnypilot port

on:
  push:
    branches:
      - dnga-staging-tici
    paths:
      - dnga_apply_v4_sunnypilot.py
      - .github/workflows/dnga-v4-sunnypilot-port.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dnga-staging-tici
          fetch-depth: 0
      - name: Relax first exact matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dnga_apply_v4_sunnypilot.py')
          s = p.read_text()
          old = ''''''      self.v33r4_decel_entry_frame = -1000000\\n      self.v33r4_decel_entry_torque = 0\\n      self.v33r4_decel_torque_cleared = False\\n      self.v33r4_positive_overlap_counter = 0\\n\\n    self.prev_enabled = enabled\\n''''''
          new = ''''''      self.v33r4_decel_entry_frame = -1000000\\n      self.v33r4_decel_entry_torque = 0\\n      self.v33r4_decel_torque_cleared = False\\n      self.v33r4_positive_overlap_counter = 0\\n''''''
          if old not in s:
            raise SystemExit('workflow prepatch: original engagement matcher not found')
          s = s.replace(old, new, 1)
          old2 = ''''''      self.v33r4_decel_entry_frame = -1000000\\n      self.v33r4_decel_entry_torque = 0\\n      self.v33r4_decel_torque_cleared = False\\n      self.v33r4_overlap_entry_frame = -1000000\\n      self.v33r4_overlap_entry_torque = 0\\n      self.v33r4_overlap_torque_cleared = False\\n      self.v33r4_positive_overlap_counter = 0\\n\\n    self.prev_enabled = enabled\\n''''''
          new2 = ''''''      self.v33r4_decel_entry_frame = -1000000\\n      self.v33r4_decel_entry_torque = 0\\n      self.v33r4_decel_torque_cleared = False\\n      self.v33r4_overlap_entry_frame = -1000000\\n      self.v33r4_overlap_entry_torque = 0\\n      self.v33r4_overlap_torque_cleared = False\\n      self.v33r4_positive_overlap_counter = 0\\n''''''
          if old2 not in s:
            raise SystemExit('workflow prepatch: replacement engagement matcher not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Apply V4.0 adaptation
        run: python3 dnga_apply_v4_sunnypilot.py
      - name: Validate
        run: |
          python3 -m py_compile opendbc/car/dnga/carcontroller.py opendbc/car/dnga/carstate.py
          git diff --check
      - name: Commit port
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opendbc/car/dnga/carcontroller.py opendbc/car/dnga/carstate.py
          git diff --cached --quiet && exit 0
          git commit -m 'DNGA V4.0: port latest controller and CarState to Sunnypilot'
          git push origin HEAD:dnga-staging-tici
