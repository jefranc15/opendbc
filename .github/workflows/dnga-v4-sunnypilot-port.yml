name: Apply DNGA V4.0 Sunnypilot port

on:
  push:
    branches:
      - dnga-staging-tici
    paths:
      - .github/workflows/dnga-v4-sunnypilot-port.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dnga-staging-tici
          fetch-depth: 0
      - name: Preserve session only across gas override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('opendbc/car/dnga/carcontroller.py')
          s = p.read_text()
          old = "      base_session_allowed = (\n        enabled and\n        long_active and\n        CS.out.cruiseState.enabled and\n        not pcm_cancel_cmd and\n        not CS.out.brakePressed\n      )\n"
          new = "      base_session_allowed = (\n        enabled and\n        (long_active or CS.out.gasPressed) and\n        CS.out.cruiseState.enabled and\n        not pcm_cancel_cmd and\n        not CS.out.brakePressed\n      )\n"
          if s.count(old) != 1:
            raise SystemExit(f'base_session_allowed matcher count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          python3 -m py_compile opendbc/car/dnga/carcontroller.py opendbc/car/dnga/carstate.py
          git diff --check
          grep -Fq '(long_active or CS.out.gasPressed)' opendbc/car/dnga/carcontroller.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opendbc/car/dnga/carcontroller.py
          git diff --cached --quiet && exit 0
          git commit -m 'DNGA V4.0: preserve ACC session through gas override'
          git push origin HEAD:dnga-staging-tici
